<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepad</title>
    <link rel="stylesheet" href="notepad-style.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="notepad-script.js" defer></script>
</head>
<body>

    <div class="notepad-container">
        <textarea id="notepad-textarea" spellcheck="false" placeholder="Type your notes here..."></textarea>
        
        <div class="toolbar">
            <span id="status">Saved</span>
            <button id="download-btn">💾 Save as .txt</button>
        </div>
    </div>

</body>
</html>
